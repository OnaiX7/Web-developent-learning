<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="to_do_liste.css">
    <title>Title</title>
</head>
<body>
<main>
    <h1>Todo App</h1>

    <form class="todo-form" action="#" method="post">
        <div class="input-wrap">
            <label for="todo">Neues Todo</label>
            <input id="todo" name="todo" type="text" placeholder="Neues Todo eingeben">
        </div>
        <button id="add-button" class="add-button" type="button">Hinzufügen</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th scope="col">Todo</th>
                <th scope="col">Status</th>
                <th scope="col">Aktionen</th>
            </tr>
            </thead>
            <tbody id="todo-table">
            <tr>
                <td>JavaScript lernen</td>
                <td><span class="status">Offen</span></td>
                <td>
                    <div class="actions">
                        <button class="action-button" type="button">Bearbeiten</button>
                        <button class="action-button done" type="button">Erledigt</button>
                        <button class="action-button delete" type="button">Löschen</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="text-done">HTML & CSS lernen</td>
                <td><span class="status done">Erledigt</span></td>
                <td>
                    <div class="actions">
                        <button class="action-button" type="button">Bearbeiten</button>
                        <button class="action-button" type="button">Offen</button>
                        <button class="action-button delete" type="button">Löschen</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="to_do_liste.js"></script>
</body>
</html>
