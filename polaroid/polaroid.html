<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Fotos</title>
    <style>

        body {
            background-color: #e8e0d5;
            font-family: sans-serif;
        }

        .galerie {
            position: relative;
            width: 300px;
            height: 400px;
            margin: 100px auto;
        }

        .polaroid {
            position: absolute;
            width: 260px;
            background-color: #ffffff;
            padding: 15px 15px 50px 15px;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4);
        }

        .polaroid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .polaroid p {
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
        }

        .foto1 {
            transform: rotate(-8deg);
        }

        .foto2 {
            top: 20px;
            left: 20px;
            transform: rotate(5deg);
        }

        .foto3 {
            top: 40px;
            left: 10px;
            transform: rotate(-2deg);
        }

    </style>
</head>
<body>

<div class="galerie">

    <div class="polaroid foto1">
        <img src="https://cdn.pixabay.com/photo/2016/11/19/14/00/code-1839406_640.jpg" alt="Code">
        <p>Code</p>
    </div>

    <div class="polaroid foto2">
        <img src="https://cdn.pixabay.com/photo/2014/12/30/05/42/source-code-583537_1280.jpg" alt="Coding">
        <p>Coding</p>
    </div>

    <div class="polaroid foto3">
        <img src="../assets/roblox.png" alt="Logo">
        <p>JavaScript</p>
    </div>

</div>
</body>
</html>
